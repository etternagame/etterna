name: Etterna CI
on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  linux-x64:
    name: Linux ${{matrix.cfg.archstr}} (${{matrix.cfg.cxx}})
    runs-on: ${{matrix.cfg.os}}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: ubuntu-24.04, apt: g++-11,   cxx: g++-11,     cc: gcc-11,   dist: false, archstr: "x64"}
          - { os: ubuntu-24.04, apt: g++-12,   cxx: g++-12,     cc: gcc-12,   dist: false, archstr: "x64"}
          - { os: ubuntu-24.04, apt: g++-13,   cxx: g++-13,     cc: gcc-13,   dist: false, archstr: "x64"}
          - { os: ubuntu-24.04, apt: g++-14,   cxx: g++-14,     cc: gcc-14,   dist: false, archstr: "x64"}
          - { os: ubuntu-24.04, apt: clang-16, cxx: clang++-16, cc: clang-16, dist: true, archstr: "x64"}
          - { os: ubuntu-24.04, apt: clang-17, cxx: clang++-17, cc: clang-17, dist: false, archstr: "x64"}
          - { os: ubuntu-24.04, apt: clang-18, cxx: clang++-18, cc: clang-18, dist: false, archstr: "x64"}
          - { os: ubuntu-24.04-arm, apt: clang-16, cxx: clang++-16, cc: clang-16, dist: false, archstr: "aarch64"}

    steps:
      - name: Checkout Etterna
        uses: actions/checkout@v3
        with:
          path: main

      - name: Checkout CrashpadTools
        uses: actions/checkout@v3
        with:
          repository: etternagame/CrashpadTools
          path: tools
      
      - name: Install Vulkan SDK
        shell: bash
        run: |
          . main/.ci/vulkan_setup_env.sh
          preset_env
          . main/.ci/vulkan_prebuilt_helpers.sh
          download_vulkan_installer ${VULKAN_SDK_PLATFORM}
          unpack_vulkan_installer ${VULKAN_SDK_PLATFORM}

      - name: Setup Crashpad
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"

          cd main/extern/crashpad
          "$HOME/depot_tools/gclient" sync
          "$HOME/depot_tools/gclient" runhooks

      - name: Install apt packages
        run: sudo apt update && sudo apt install ${{ matrix.cfg.apt }} nasm ninja-build libglew-dev libxrandr-dev libxtst-dev libpulse-dev libasound-dev libogg-dev libvorbis-dev xorg-dev libcurl4-openssl-dev
      - name: Install OpenSSL 3.5
        run: mkdir -p tmp/openssl && cd tmp/openssl && wget https://github.com/openssl/openssl/releases/download/openssl-3.5.1/openssl-3.5.1.tar.gz && tar -xf openssl-3.5.1.tar.gz && cd openssl-3.5.1 && ./Configure --prefix="${HOME}/toolchain" && make -j `nproc` && make test -j `nproc` && sudo make install
      - name: Generate CMake
        run: mkdir main/build && cd main/build && cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=FALSE -DBUILD_EXAMPLES=FALSE -DOPENSSL_ROOT_DIR=~/toolchain/ -DCMAKE_CXX_FLAGS="-D_DEBUG" ${{ (matrix.cfg.archstr == 'aarch64' || matrix.cfg.cxx == 'g++-11') && '-DWITH_VULKAN=OFF' || '' }} ..
        env:
          CXX: ${{matrix.cfg.cxx}}
          CC: ${{matrix.cfg.cc}}

      - name: Build Project
        run: cd main/build && ninja

      - name: Generate binary
        if: ${{matrix.cfg.dist}}
        run: cd main/build && cpack
      
      - name: Upload Binary
        if: ${{matrix.cfg.dist}}
        uses: actions/upload-artifact@v4
        with:
          name: "Etterna - Linux ${{matrix.cfg.archstr}}"
          path: '${{github.workspace}}/main/build/*.tar.gz'

      - name: Update Environment Variables
        if: ${{matrix.cfg.dist}}
        run: echo "${{github.workspace}}/tools/linux" >> $GITHUB_PATH

      - name: Generate Symbols
        if: ${{matrix.cfg.dist}}
        run: |
          echo "Running objcopy..."
          mkdir ${{github.workspace}}/sym
          objcopy --only-keep-debug ${{github.workspace}}/main/Etterna ${{github.workspace}}/sym/Etterna
          echo "Dumping Symbols..."
          dump_syms ${{github.workspace}}/sym/Etterna ${{github.workspace}}/main/Etterna > ${{github.workspace}}/sym/Etterna.sym
          echo "Stripping debug symbols from binary..."
          strip ${{github.workspace}}/main/Etterna
      
      - name: Prepare symbols for upload artifacts
        if: ${{matrix.cfg.dist}}
        run: cd ${{github.workspace}}/sym && ${{github.workspace}}/main/.ci/prepare_symbols.py

      - name: Upload Symbols to action artifacts
        if: ${{matrix.cfg.dist}}
        uses: actions/upload-artifact@v4
        with:
          name: Etterna Symbols Linux ${{matrix.cfg.archstr}} - ${{github.sha}}
          path: '${{github.workspace}}/sym/EtternaSymbolsUploadDir'

      - name: Get version for CrashServer Upload
        id: get_version
        if: ${{ matrix.cfg.dist && github.event_name == 'release' && github.event.action == 'published' }}
        run: |
          echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}
      
      - name: Upload Symbols to Crash Server
        if: ${{ matrix.cfg.dist && github.event_name == 'release' && github.event.action == 'published' }}
        run: symupload ${{github.workspace}}/sym/Etterna.sym "https://crash.etterna.dev/api/symbol/upload?api_key=${{secrets.CRASHSERVER_API_KEY}}&version=${{steps.get_version.outputs.VERSION}}"

      - name: Upload files to Release
        uses: softprops/action-gh-release@v1
        if: ${{ matrix.cfg.dist && github.event_name == 'release' && github.event.action == 'published' }}
        with:
          files: ${{github.workspace}}/main/build/*.tar.gz

  macos_aarch64:
    name: macOS aarch64 ${{matrix.cfg.name}}
    runs-on: ${{matrix.cfg.os}}
    strategy:
      fail-fast: false
      matrix:
        cfg:
          - { os: macos-14,     name: "Sonoma", dist: true }

    steps:

      - name: Checkout Etterna
        uses: actions/checkout@v3
        with:
          path: main

      - name: Checkout CrashpadTools
        uses: actions/checkout@v3
        with:
          repository: etternagame/CrashpadTools
          path: tools

      - name: Install Vulkan SDK
        shell: bash
        run: |
          . main/.ci/vulkan_setup_env.sh
          preset_env
          . main/.ci/vulkan_prebuilt_helpers.sh
          download_vulkan_installer ${VULKAN_SDK_PLATFORM}
          unpack_vulkan_installer ${VULKAN_SDK_PLATFORM}

      - name: Setup Crashpad
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"

          cd main/extern/crashpad
          "$HOME/depot_tools/gclient" sync
          "$HOME/depot_tools/gclient" runhooks

      - name: Install homebrew packages
        run: brew install cmake nasm yasm ninja openssl

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Update CPack Environment
        if: ${{matrix.cfg.dist}}
        run: |
          echo "ETT_MAC_SYS_NAME=M1" >> $GITHUB_ENV

      - name: Generate CMake
        run: mkdir main/build && cd main/build && cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWITH_CRASHPAD=OFF -DBUILD_TESTS=FALSE -DBUILD_EXAMPLES=FALSE -G Ninja ..

      - name: Build Project
        run: cd main/build && ninja

      - name: Generate binary
        if: ${{matrix.cfg.dist}}
        run: cd main/build && cpack

      - name: Upload Binary
        if: ${{matrix.cfg.dist}}
        uses: actions/upload-artifact@v4
        with:
          name: "Etterna - macOS aarch64"
          path: '${{github.workspace}}/main/build/*.dmg'

      - name: Update Environment Variables
        if: ${{matrix.cfg.dist}}
        run: |
          echo "${{github.workspace}}/tools/mac" >> $GITHUB_PATH
          echo "ETTERNA_ARCH=aarch64" >> $GITHUB_ENV

      - name: Generate Symbols
        if: ${{matrix.cfg.dist}}
        run: |
          echo "Running dsymutil..."
          dsymutil -o ${{github.workspace}}/main/Etterna.dsym main/Etterna.app/Contents/MacOS/Etterna > /dev/null
          echo "Dumping Symbols..."
          dump_syms ${{github.workspace}}/main/Etterna.dsym main/Etterna.app/Contents/MacOS/Etterna > ${{github.workspace}}/main/Etterna.sym
          echo "Stripping debug symbols from binary..."
          strip main/Etterna.app/Contents/MacOS/Etterna

      - name: Prepare symbols for upload artifacts
        if: ${{matrix.cfg.dist}}
        run: cd main && ${{github.workspace}}/main/.ci/prepare_symbols.py

      - name: Upload Symbols to action artifacts
        if: ${{matrix.cfg.dist}}
        uses: actions/upload-artifact@v4
        with:
          name: Etterna Symbols Mac aarch64 - ${{github.sha}}
          path: '${{github.workspace}}/main/EtternaSymbolsUploadDir'

      - name: Get version for CrashServer Upload
        id: get_version
        if: ${{ matrix.cfg.dist && github.event_name == 'release' && github.event.action == 'published' }}
        run: |
          echo ::set-output name=VERSION::${GITHUB_REF#refs/tags/}

      - name: Upload Symbols to Crash Server
        if: ${{ matrix.cfg.dist && github.event_name == 'release' && github.event.action == 'published' }}
        run: symupload ${{github.workspace}}/main/Etterna.sym "https://crash.etterna.dev/api/symbol/upload?api_key=${{secrets.CRASHSERVER_API_KEY}}&version=${{ steps.get_version.outputs.VERSION }}"

      - name: Upload files to Release
        uses: softprops/action-gh-release@v1
        if: ${{ matrix.cfg.dist && github.event_name == 'release' && github.event.action == 'published' }}
        with:
          files: ${{github.workspace}}/main/build/*.dmg

