[OptionExplanations]
Accel=选择加速, 减速或是其他调整按键速度的特效.
AllowExtraStage=当选择为开而且活动模式没有开启时，满足一定条件会让晚间进入额外关卡.
AllowHoldForOptions=如歌设定为双击, 在选歌界面长按 <开始> 不会进入歌曲选项.
AllowSongDeletion=允许玩家在选曲模式中使用 Ctrl + Backspace 永久删除目前选择的歌曲.
AllowMultipleHighScoreWithSameName=是否记录一个名称内多个最高分.
AllowMultipleToasties=是否在一首歌曲内多次显示彩蛋.
Announcer=系统语言的选择.
Appearance=选择预设的按键遮挡特效. 显示使按键在判定区附近出现. 消失使按键在判定区附近消失.
Appearance Options=选择游戏外观和其他类型的选项.
Theme Options=改变主题特有功能的选项.
ArcadeOptionsNavigation=预设类型: 按 <开始> 直接移到底, <上>/<下> 移动指定项目.  机台类型: 按 <开始> 会到下一个指定项, <上>/<下> 沒有功能.
Assist=节拍器
Attacks=选择游玩时是否出现干扰特效.
AttractSoundFrequency=选择选曲音效在固定时间内播放次数.
AutoAdjust=自动校准铺面设定.
AutoMapOnJoyChange=若选择为开, 所有初次连接的输入控制器将会自动映射设定.
AutoPlay=自动游玩, 不能用此方式进入自动关卡.
AutogenSteps=自动谱面生成, 至少需要一种谱面.
AxisFix=针对部分有模拟控制键的控制器设定轴向, 目前在 Mac OSX 和 Linux JS driver 无法动作.
BGBrightness=背景明亮度设定.
Background=背景动画开关设定.
BackgroundFitMode=改变背景填充屏幕的方式.
BarDrain=扣血强度设定.
BatLives=电池数量设定
Calibrate Machine Sync=机器同步校准设定.
Center Image=调整画面中心设定.
Characters=3D角色显示方式.
Clear Machine Edits=清除机台內已储存的自定义谱面.
Clear USB edits=清除USB的自定义谱面
Clear Machine Stats=清除机台內的所有成绩.
CoinMode=投币设定, 一般选择家用会出现标题清单.
CoinModeNoHome=投币设定，一般选择为投币，如果有特殊活动则选择为免费.
CoinsPerCredit=每局所需投币数.
ComboContinuesBetweenSongs=是否在下一关接续上一关的COMBO数.
Connection=连接到服务器.
CreateNew=创建新的谱面.
Create New Profile=建立个人资料.
EnableMinidumpUpload=在游戏闪退时向服务器发送错误信息. 更改此项必须重新启动游戏.
DefaultFailType=选择游戏结束的方式. 立即结束会在玩家生命时判定立即结束游玩. 继续游玩会在玩家生命时判定判定失败, 但仍可继续. 歌曲结尾会在歌曲结束后判定失败与否. 关会取消失败判定.
DefaultFailTypeNoOff=选择游戏结束的方式. 立即结束会在玩家生命时判定立即结束游玩. 继续游玩会在玩家生命时判定判定失败, 但仍可继续. 歌曲结尾会在歌曲结束后判定失败与否.
DefaultNoteSkin=选择预设按键样式.
DelayedBack=如果选择为长按, 在退出时判定需要按 <返回> 1秒后离开. 也对重新开始键
Delete=谱面的删除设定.
Difficulty=谱面的难易度设定.
DisplayAspectRatio=选择画面比例, 一般选择为16:9或16:10, 古早的则是4:3.
DisplayColorDepth=选择游戏色深,对窗口模式无效.
DisplayResolution=选择解析度.
FullscreenType=选择全屏幕或无边框窗口化.
Display Options=背景,外观与用户界面的选项.
ScrollDir=设定谱面滚动方向.
EasterEggs=选择彩蛋(PERFECT及以上COMBO250个).
Edit Songs/Steps=制作或编辑谱面.
Practice Songs/Steps=练习歌曲与谱面.
EditorShowBGChangesPlay=选择是否要开启背景动画(编辑与练习模式专用).
EditClearPromptThreshold=设定清除多少按键量可无需提示.
Effect=选择谱面与判定区特效.
EffectsReceptor=选择判定区特效.
EffectsArrow=选择谱面与按键特效.
EnableAttackSounds=如果开启的话, 会从干扰开始与结束的地方播放音效.
EnableMineHitSound=如果开启的话, 击中炸弹会播放音效.
EnablePitchRates=如果开启的话, 调整播放速率还会改变音调.
EventMode=如果选择为开將会沒有关卡限制, 但是永远不会出现奖励关卡与额外关卡.
Exit=退出
Fail=当你时判定的系统行为设定.
FailOffForFirstStageEasy=是否允许第一关简单难度关卡不失败.
FailOffInBeginner=是否允许初心者难度关卡不失败.
FastLoad=是否不进行检查歌曲变动直接进行读取歌曲.
FastLoadAdditionalSongs=是否不进行检查追加歌曲变动直接进行读取歌曲.
FastNoteRendering=若开启, 每一个按键的透视Z缓冲將不会清除, 这会导致3D按键样式发生不正常显示, 但大幅提高了游戏性能.
Fill Machine Stats=
FullTapExplosions = 选择是否开启完整的按键打击动画. 选择快速会讓动画在松手的瞬间结束.
FooBar=描述示例
Game=改变目前的游戏类型.
Get a better editor= 下載 Arrow Vortex, 一个功能强大且便捷的独立编辑器, 完爆原本的编辑器.
GetRankingName=选择签名画面的显示方式.
Graphics/Sound Options=画面与声音的相关选项.
GranularHiddenOffset=更改使用消失时判定按键的消失位置.
GranularSuddenOffset=更改使用出现时判定按键的出现位置.
Group=
HarshHotLifePenalty=若血条为满並此项开启时判定若有BAD判定会直接损失10%的血量.
HiddenSongs=若选择为开, 某些特殊设定的歌曲只在挑战组曲与随机转盘中出现.
Hide=选择是否开启隱藏特效. 黑暗使判定区消失. 盲打使判定消失. 覆盖使背景变暗.
Holds=选择长鍵特效.
InputDebounceTime=设定踏板时判定间量，使用这个设定可以避免发生踏板连发的狀況.
InputOptions=测试輸入,輸入选项与声音同步.
Insert=选择要插入按键的类型.
Insert Credit=Insert Credit
Invalid=无效的轨道定义.
Key Joy Mappings=按键与控制器设定.
Language=选择语言.
LifeDifficulty=扣血强度设定, 数值越小扣血强度越强, 回血速度越慢.
LifeType=选择血条类型.
Advanced Options=改变像是记分样式和判定与扣血强度等进阶项.
LiftsOnOsuHolds=选择是否在Osu长鍵结尾添加尾鍵.
MasterVolume=游戏自身音量设定.
HighResolutionTextures=高清材质选择设定.
MaxHighScoresPerListForMachine=在机器记录里单首歌曲可记录最高分的数量.
MaxHighScoresPerListForPlayer=在玩家记录里单首歌曲可记录最高分的数量.
MaxTextureResolution=最大材质解析度设定.
MenuTimer=菜单计时判定器设定, 如果选择为开时判定会有时间限制.
Mines=选择炸弹特效.
MinTNSToHideNotes=使按键击中后消失的最低判定.
MoveRandomToEnd=將选曲画面的随机选曲项移到最下层.
MovieColorDepth=选择影片色深.
MusicWheelSwitchSpeed=选曲速度设定.
MusicWheelUsesSections=选择歌曲排序显示方式.
Network Options=连接到服务器或是改变服务器选项.
No Memory Card=沒有找到USB记忆卡.
NoGlow = 在消失/出现特效下开启按键打击动画.
NoteSkins=选择按键样式.
NumBackgrounds=选择随机动画背景最大量.
OnlyDedicatedMenuButtons=选择按键类型, 如果使用大型机台专用选择按键, 需先设定按键映射, 否则无法动作.
OptionsRandomJukebox=音乐盒随机设定.
OsMountPlayer1=
