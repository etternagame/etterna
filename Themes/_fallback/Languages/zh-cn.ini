Overscan Correction=若有部分画面超出屏幕外的话使用此选项校正.
Persp=调整空间视角.
PracticeMode=开启时判定允许玩家自由调整进度已练习特定的部分. 右键点击进度图标记位置, Backspace 移到标记位置.
Player1Profile=1P使用个人资料的设定.
Player2Profile=2P使用个人资料的设定.
PlayerAutoPlay=交給CPU代打.
PreloadSounds=如果选择开將会预读歌曲文件, 需要较好的硬件支持.
Profile=
Export Packages=导出你的安裝內容到整合包.
PONextScreen=选择下一个界面是游玩画面或是其它的设置界面.
Profiles=编辑在此机器上的个人资料.
PackProgressInWheel=在歌曲转盘显示每个曲包中已游玩的歌曲数.
ProgressiveLifebar=强化连续MISS扣血量.
ProgressiveStageLifebar=强化最后一关扣血强度, 在活动模式无效.
ProTiming=选择使用专家判定, 这將会置換成更精准的时判定时间表.
RandomBackgroundMode=选择随机动画背景类型.
More Options=更多进阶项.
RandomModifiers=增加谱面与判定区的特效.
RateList=改变歌曲播放速度.
RefreshRate=设定画面更新率, 只在全屏有效.
